 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250">
  <defs>
    <style>
      .month-label { font-size: 12px; fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .day-label { font-size: 11px; fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 14px; fill: #c9d1d9; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .subtitle { font-size: 12px; fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="250" fill="#0d1117" rx="6"/>
  
  <!-- Title -->
  <text x="30" y="30" class="title">847 contributions in the last year</text>
  
  <!-- Month labels -->
  <text x="75" y="70" class="month-label">Jul</text>
  <text x="120" y="70" class="month-label">Aug</text>
  <text x="165" y="70" class="month-label">Sep</text>
  <text x="210" y="70" class="month-label">Oct</text>
  <text x="255" y="70" class="month-label">Nov</text>
  <text x="300" y="70" class="month-label">Dec</text>
  <text x="345" y="70" class="month-label">Jan</text>
  <text x="390" y="70" class="month-label">Feb</text>
  <text x="435" y="70" class="month-label">Mar</text>
  <text x="480" y="70" class="month-label">Apr</text>
  <text x="525" y="70" class="month-label">May</text>
  <text x="570" y="70" class="month-label">Jun</text>
  <text x="615" y="70" class="month-label">Jul</text>

  <!-- Day labels -->
  <text x="30" y="105" class="day-label">Mon</text>
  <text x="30" y="135" class="day-label">Wed</text>
  <text x="30" y="165" class="day-label">Fri</text>

  <!-- Contribution squares - HEAVILY FILLED WITH GREEN -->
  <!-- Jul -->
  <g filter="url(#glow)">
    <rect x="65" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="65" y="125" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="65" y="155" width="12" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- Aug -->
  <g filter="url(#glow)">
    <rect x="110" y="95" width="12" height="12" fill="#0e4429" rx="2"/>
    <rect x="110" y="125" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="110" y="155" width="12" height="12" fill="#0e4429" rx="2"/>
  </g>

  <!-- Sep -->
  <g filter="url(#glow)">
    <rect x="155" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="155" y="125" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="155" y="155" width="12" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- Oct -->
  <g filter="url(#glow)">
    <rect x="200" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="200" y="125" width="12" height="12" fill="#0e4429" rx="2"/>
    <rect x="200" y="155" width="12" height="12" fill="#10b981" rx="2">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Nov -->
  <g filter="url(#glow)">
    <rect x="245" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="245" y="125" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="245" y="155" width="12" height="12" fill="#0e4429" rx="2"/>
  </g>

  <!-- Dec -->
  <g filter="url(#glow)">
    <rect x="290" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="290" y="125" width="12" height="12" fill="#0e4429" rx="2"/>
    <rect x="290" y="155" width="12" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- Jan -->
  <g filter="url(#glow)">
    <rect x="335" y="95" width="12" height="12" fill="#0e4429" rx="2"/>
    <rect x="335" y="125" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="335" y="155" width="12" height="12" fill="#10b981" rx="2">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Feb -->
  <g filter="url(#glow)">
    <rect x="380" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="380" y="125" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="380" y="155" width="12" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- Mar -->
  <g filter="url(#glow)">
    <rect x="425" y="95" width="12" height="12" fill="#10b981" rx="2">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="425" y="125" width="12" height="12" fill="#0e4429" rx="2"/>
    <rect x="425" y="155" width="12" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- Apr -->
  <g filter="url(#glow)">
    <rect x="470" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="470" y="125" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="470" y="155" width="12" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- May -->
  <g filter="url(#glow)">
    <rect x="515" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="515" y="125" width="12" height="12" fill="#10b981" rx="2">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="515" y="155" width="12" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- Jun -->
  <g filter="url(#glow)">
    <rect x="560" y="95" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="560" y="125" width="12" height="12" fill="#0e4429" rx="2"/>
    <rect x="560" y="155" width="12" height="12" fill="#10b981" rx="2"/>
  </g>

  <!-- Jul (recent) -->
  <g filter="url(#glow)">
    <rect x="605" y="95" width="12" height="12" fill="#10b981" rx="2">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="605" y="125" width="12" height="12" fill="#10b981" rx="2"/>
    <rect x="605" y="155" width="12" height="12" fill="#10b981" rx="2">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Legend -->
  <text x="750" y="110" class="subtitle">Less</text>
  
  <rect x="800" y="100" width="10" height="10" fill="#161b22" rx="1"/>
  <rect x="815" y="100" width="10" height="10" fill="#0e4429" rx="1"/>
  <rect x="830" y="100" width="10" height="10" fill="#10b981" rx="1"/>
  <rect x="845" y="100" width="10" height="10" fill="#10b981" rx="1"/>
  
  <text x="865" y="110" class="subtitle">More</text>
  
  <!-- Learn link -->
  <text x="750" y="200" class="subtitle">Learn how we count contributions →</text>
</svg>
